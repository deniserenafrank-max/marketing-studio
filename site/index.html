<nav class="hud" aria-label="Keyring" data-hud>

  </button>

  <div class="hud-toggles">
    <button class="hud-toggle" type="button" data-toggle-sound aria-pressed="false"><span class="ico-slot" data-ico-sound></span><span class="hud-toggle-label" data-sound-label>Sound off</span></button>
