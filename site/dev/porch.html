<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porch scene bench</title>
<link rel="stylesheet" href="../src/styles/tokens.css">
<style>
  :root { --c-pine-1:#03110c; --c-pine-2:#061a13; --c-pine-3:#0c2a1f; --c-pine-4:#143a2d; }
  html, body { margin:0; height:100%; background: linear-gradient(180deg, #020d09 0%, var(--c-bg) 55%, var(--c-surface) 100%); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; left:16px; bottom:16px; color:var(--c-ink); font:14px system-ui; display:flex; gap:12px; align-items:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui"><label>scroll <input id="s" type="range" min="0" max="1" step="0.01" value="0"></label><label><input id="r" type="checkbox"> reduced</label></div>
<script type="module">
  import { createPorchScene } from '../src/scenes/porch.js';
  const params = new URLSearchParams(location.search);
  const scene = createPorchScene(document.getElementById('c'), { reduced: params.has('reduced'), lowPower: params.has('low') });
  window.__scene = scene;
  if (params.has('scroll')) scene.setScroll(Number(params.get('scroll')));
  document.getElementById('s').addEventListener('input', (e) => scene.setScroll(Number(e.target.value)));
  document.getElementById('r').addEventListener('change', (e) => scene.setReduced(e.target.checked));
  window.addEventListener('pointermove', (e) => scene.setPointer((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1));
</script>
</body>
</html>
